[[plugins]]
  package = "@netlify/plugin-lighthouse"

[[redirects]]
  from = "/rickroll"
  to = "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
[[redirects]]
  from = "/breath"
  to = "/breathe"

# Astro fingerprints everything under /_astro, so it can be cached forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Icons and images are not fingerprinted, so cache for a week and revalidate.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Trust and safety headers flagged by Lighthouse's Best Practices audits.
# Deliberately no script-src CSP here: astro-embed injects third-party
# scripts for tweet/video embeds, which a strict policy would break.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"
